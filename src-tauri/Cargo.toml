[package]
name = "gui4tihulu-star-trail"
version = "0.3.5"
description = "Modern cross-platform desktop GUI for tihulu-star-trail"
authors = ["Tihulu contributors"]
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "gui4tihulu_star_trail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Threading"] }
