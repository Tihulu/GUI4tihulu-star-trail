[package]
name = "gui4tihulu-star-trail"
version = "0.2.0"
description = "Modern cross-platform desktop GUI for tihulu-star-trail"
authors = ["Tihulu contributors"]
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "gui4tihulu_star_trail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
kamadak-exif = "0.6"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Threading"] }
