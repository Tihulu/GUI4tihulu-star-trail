name: Probe packaged Photo Editor runtime

on:
  push:
    branches:
      - fix/visible-group-include-scope
    paths:
      - .github/workflows/editor-runtime-probe.yml

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download v0.3.13 AppImage from run 202
        uses: actions/download-artifact@v4
        with:
          name: gui4tihulu-star-trail-Linux x86_64
          path: packaged-linux
          repository: Tihulu/GUI4tihulu-star-trail
          run-id: 33038342483
          github-token: ${{ github.token }}

      - name: Install runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-driver xvfb libwebkit2gtk-4.1-0 libgtk-3-0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install probe dependencies
        run: |
          npm install --no-save --ignore-scripts selenium-webdriver
          cargo install tauri-driver --locked

      - name: Prepare probe runtime
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/editor-runtime-probe"
          mkdir -p "$root/bin" "$root/input"
          cat > "$root/bin/tihulu" <<'EOF'
          #!/usr/bin/env bash
          if [[ "${1:-}" == "--help" ]]; then echo 'tihulu probe engine'; exit 0; fi
          if [[ "${1:-}" == "run" && "${2:-}" == "--help" ]]; then echo 'Usage: tihulu run'; exit 0; fi
          exit 0
          EOF
          chmod +x "$root/bin/tihulu"
          appimage="$(find "$GITHUB_WORKSPACE/packaged-linux" -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          chmod +x "$appimage"
          echo "APPIMAGE_PATH=$appimage" >> "$GITHUB_ENV"
          echo "ACCEPTANCE_INPUT_DIR=$root/input" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: Run focused native editor probe
        shell: bash
        run: |
          export TAURI_WEBVIEW_AUTOMATION=1
          export APPIMAGE_EXTRACT_AND_RUN=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout --verbose --signal=TERM --kill-after=10s 150s xvfb-run -a node tests/editor-runtime-probe.mjs
