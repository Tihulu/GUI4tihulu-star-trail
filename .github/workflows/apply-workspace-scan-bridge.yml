name: Apply workspace scan bridge patch

on:
  push:
    branches:
      - fix/visible-group-include-scope

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/visible-group-include-scope
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/apply-workspace-scan-bridge.py

      - name: Commit patch and remove helpers
        shell: bash
        run: |
          git rm .github/workflows/apply-workspace-scan-bridge.yml scripts/apply-workspace-scan-bridge.py
          git add src/main.ts
          git config user.name "Tihulu"
          git config user.email "40742160+Tihulu@users.noreply.github.com"
          git commit -m "fix: expose deterministic workspace scan bridge"
          git push origin HEAD:fix/visible-group-include-scope
