name: Apply visible group include scope patch

on:
  push:
    branches:
      - fix/visible-group-include-scope

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/visible-group-include-scope
      - name: Apply workspace scope patch
        run: python3 scripts/apply-visible-scope-patch.py
      - name: Commit patch and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-visible-scope-patch.py .github/workflows/apply-visible-scope-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: scope frame inclusion to active workspace group"
          git push origin HEAD:fix/visible-group-include-scope
