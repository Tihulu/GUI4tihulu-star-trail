name: Apply Photo Editor no-op fast path

on:
  push:
    branches:
      - fix/visible-group-include-scope
    paths:
      - .github/workflows/apply-editor-noop-fastpath.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/visible-group-include-scope
          fetch-depth: 0

      - name: Apply focused editor patch
        run: python scripts/apply-editor-noop-fastpath.py

      - name: Commit production fix and remove temporary diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/apply-editor-noop-fastpath.yml \
            scripts/apply-editor-noop-fastpath.py \
            .github/workflows/editor-runtime-probe.yml \
            tests/editor-runtime-probe.mjs \
            tests/thumbnail-lock-convoy.test.ts
          git add src/studio-editor.ts src/photo-thumbnail-manager.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: skip no-op Photo Editor pixel pass"
          git push origin HEAD:fix/visible-group-include-scope
