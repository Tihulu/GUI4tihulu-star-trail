name: Apply v0.3.10 runtime hotfix

on:
  push:
    branches:
      - fix/v0310-runtime-regressions

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic hotfix
        run: python3 scripts/apply-v0310-runtime-fixes.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json src-tauri/src/lib.rs \
            src/branding.ts src/bootstrap.ts src/photo-thumbnail-manager.ts src/workspace-parity.css \
            scripts/install.sh tests/source-regressions.test.mjs
          git diff --cached --check
          git commit -m "fix: restore GPU runtime, thumbnails, workspace stability and app identity"
          git push origin HEAD:fix/v0310-runtime-regressions
