name: Apply v0.3.9 implementation patch

on:
  push:
    branches:
      - fix/v039-workspace-gpu-performance
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v039-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/v039-workspace-gpu-performance
          fetch-depth: 0
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils \
            patchelf
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply implementation patch
        run: python3 scripts/apply-v039.py
      - name: Install frontend dependencies
        run: npm install --no-package-lock
      - name: Generate native icon set
        run: npx tauri icon app-icon.svg
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Type-check frontend
        run: npm run check
      - name: Frontend regression tests
        run: npm test
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Commit checked implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add src/job-policy.ts tests
          git status --short
          git commit -m "fix: request-scoped hardware and native thumbnails"
          git push origin HEAD:fix/v039-workspace-gpu-performance
