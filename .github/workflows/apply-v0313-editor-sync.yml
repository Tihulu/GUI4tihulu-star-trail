name: Apply v0.3.13 editor sync patch

on:
  push:
    branches:
      - fix/visible-group-include-scope
    paths:
      - scripts/apply-v0313-editor-sync.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/visible-group-include-scope
      - name: Apply deterministic workspace/editor sync
        run: python3 scripts/apply-v0313-editor-sync.py
      - name: Commit patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-v0313-editor-sync.py .github/workflows/apply-v0313-editor-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: synchronize Photo Editor with rendered workspace grid'
          git push origin HEAD:fix/visible-group-include-scope
