name: Build desktop apps

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    name: TypeScript + Rust regression tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils patchelf
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install frontend dependencies
        run: npm install
      - name: Generate native icon set
        run: npx tauri icon app-icon.svg
      - name: Type-check frontend
        run: npm run check
      - name: Frontend regression tests
        run: npm test
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  build:
    needs: quality
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            platform: ubuntu-22.04
            args: --bundles appimage
            asset: src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macOS Universal
            platform: macos-latest
            args: --bundles dmg --target universal-apple-darwin
            asset: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows x86_64
            platform: windows-latest
            args: --bundles nsis
            asset: src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux prerequisites
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm install

      - name: Generate native icon set
        run: npx tauri icon app-icon.svg

      - name: Type-check frontend
        run: npm run check

      - name: Build desktop package
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: gui4tihulu-star-trail-${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  appimage_acceptance:
    name: Linux packaged AppImage acceptance
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packaged Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: gui4tihulu-star-trail-Linux x86_64
          path: packaged-linux

      - name: Install packaged-runtime test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-driver xvfb libwebkit2gtk-4.1-0 libgtk-3-0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install WebDriver client and tauri-driver
        run: |
          npm install --no-save --ignore-scripts selenium-webdriver
          cargo install tauri-driver --locked

      - name: Prepare strict hardware-policy acceptance engine
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gui4tihulu-acceptance"
          mkdir -p "$root/bin" "$root/input" "$root/output"
          cat > "$root/bin/tihulu" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "--help" ]]; then
            echo "tihulu-star-trail packaged acceptance engine"
            exit 0
          fi
          if [[ "${1:-}" == "run" && "${2:-}" == "--help" ]]; then
            printf '%s\n' \
              'Usage: tihulu run [OPTIONS]' \
              '  --group-hardware <auto|cpu|gpu|hybrid>' \
              '  --trail-hardware <auto|cpu|gpu|hybrid>' \
              '  --timelapse-hardware <auto|cpu|gpu|hybrid>'
            exit 0
          fi
          printf '%s\n' "$@" > "${TIHULU_ACCEPTANCE_LOG:?}"
          echo 'Grouping Hardware acceleration: NVIDIA CUDA'
          echo 'Rendering star trail'
          echo 'Hardware acceleration: NVIDIA CUDA'
          echo 'timelapse'
          echo 'Hardware acceleration: NVIDIA CUDA'
          exit 0
          EOF
          chmod +x "$root/bin/tihulu"
          appimage="$(find "$GITHUB_WORKSPACE/packaged-linux" -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          chmod +x "$appimage"
          echo "APPIMAGE_PATH=$appimage" >> "$GITHUB_ENV"
          echo "FAKE_TIHULU=$root/bin/tihulu" >> "$GITHUB_ENV"
          echo "FAKE_BIN=$root/bin" >> "$GITHUB_ENV"
          echo "ACCEPTANCE_INPUT_DIR=$root/input" >> "$GITHUB_ENV"
          echo "ACCEPTANCE_OUTPUT_DIR=$root/output" >> "$GITHUB_ENV"
          echo "TIHULU_ACCEPTANCE_LOG=$root/engine-argv.txt" >> "$GITHUB_ENV"
          echo "ACCEPTANCE_SCREENSHOT=$root/appimage-acceptance.png" >> "$GITHUB_ENV"

      - name: Run real packaged AppImage acceptance
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          export PATH="$FAKE_BIN:$PATH"
          export TAURI_WEBVIEW_AUTOMATION=1
          export APPIMAGE_EXTRACT_AND_RUN=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          export LIBGL_ALWAYS_SOFTWARE=1
          echo "Starting packaged AppImage acceptance with a 180-second hard watchdog"
          timeout --verbose --signal=TERM --kill-after=10s 180s \
            xvfb-run -a node tests/packaged-appimage.mjs

      - name: Upload acceptance screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-acceptance-screenshot
          path: ${{ env.ACCEPTANCE_SCREENSHOT }}
          if-no-files-found: ignore

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build
      - appimage_acceptance
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: gui4tihulu-star-trail-*
          path: release-assets
          merge-multiple: true

      - name: Normalize release asset names and create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          while IFS= read -r -d '' file; do
            base="${file#./}"
            normalized="${base// /.}"
            if [[ "$base" != "$normalized" ]]; then
              mv -- "$base" "$normalized"
            fi
          done < <(find . -maxdepth 1 -type f -print0)
          sha256sum * > SHA256SUMS.txt

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; refreshing its checksum manifest from the uploaded release assets."
            checksum_tmp="$(mktemp)"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
              --jq '.assets[] | select(.name != "SHA256SUMS.txt") | select(.digest != null and (.digest | startswith("sha256:"))) | "\(.digest | sub("^sha256:"; ""))  \(.name)"' \
              | LC_ALL=C sort -k2 > "$checksum_tmp"
            test -s "$checksum_tmp"
            cp "$checksum_tmp" release-assets/SHA256SUMS.txt
            gh release upload "$tag" release-assets/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            exit 0
          fi

          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "Tihulu Star Trail Studio $tag"
