name: Build desktop apps

on:
  push:
    branches:
      - main
      - "feature/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            platform: ubuntu-22.04
            args: --bundles appimage
          - name: Linux ARM64
            platform: ubuntu-22.04-arm
            args: --bundles appimage
          - name: macOS Universal
            platform: macos-latest
            args: --bundles dmg --target universal-apple-darwin
          - name: Windows x86_64
            platform: windows-latest
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux prerequisites
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install macOS Rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Type-check frontend
        run: npm run check

      - name: Build bundle for branch and pull request
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload CI bundle
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: gui4tihulu-star-trail-${{ matrix.name }}
          path: src-tauri/target/**/bundle/**/*
          if-no-files-found: error

      - name: Build and publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Tihulu Star Trail Studio ${{ github.ref_name }}
          releaseBody: |
            Cross-platform desktop GUI for tihulu-star-trail.

            The one-line installers also install tihulu-star-trail automatically when the engine is missing.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
