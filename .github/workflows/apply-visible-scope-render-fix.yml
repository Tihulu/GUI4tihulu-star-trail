name: Apply visible scope render fix

on:
  push:
    branches:
      - fix/visible-group-include-scope

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/visible-group-include-scope
      - name: Apply deterministic visible scope render fix
        run: python3 scripts/apply-visible-scope-render-fix.py
      - name: Commit fix and remove helpers
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-visible-scope-render-fix.yml scripts/apply-visible-scope-render-fix.py
          git add src/main.ts tests/group-visible-include-scope.test.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: preserve active group visibility during frame rerender"
          git push origin HEAD:fix/visible-group-include-scope
